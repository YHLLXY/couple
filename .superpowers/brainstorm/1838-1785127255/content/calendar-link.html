<h2>日记 × 日历联动</h2>
<p class="subtitle">已有的甜蜜日历已经展示了签到、心愿、纪念日。日记要不要也上日历？</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>不上日历</h3>
      <p>日记是独立模块，只在日记页面内查看。日历保持现有的三色标记（签到/心愿/纪念日），不增加复杂度。</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>日历上显示日记标记</h3>
      <p>有日记的日期在月历上多一个 📔 标记（第四种颜色）。点击日期可以同时看到该天的日记卡片和原有信息。</p>
    </div>
  </div>
</div>
