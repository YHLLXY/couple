<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF7A95"/>
      <stop offset="100%" style="stop-color:#FF5E7A"/>
    </linearGradient>
    <linearGradient id="bean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF"/>
      <stop offset="100%" style="stop-color:#FFE8EC"/>
    </linearGradient>
  </defs>

  <!-- 圆角方形背景 -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- 爱心形状 -->
  <path d="M256 140 C256 140, 140 80, 100 180 C60 280, 150 340, 256 420 C362 340, 452 280, 412 180 C372 80, 256 140, 256 140Z"
        fill="none" stroke="#FFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 小甜豆 — 爱心中心的可爱豆子 -->
  <ellipse cx="256" cy="250" rx="58" ry="68" fill="url(#bean)"/>

  <!-- 豆子上的笑脸 -->
  <circle cx="238" cy="240" r="8" fill="#FF7A95"/>
  <circle cx="274" cy="240" r="8" fill="#FF7A95"/>
  <path d="M235 268 Q256 290 277 268"
        fill="none" stroke="#FF7A95" stroke-width="6" stroke-linecap="round"/>

  <!-- 脸颊红晕 -->
  <ellipse cx="222" cy="258" rx="10" ry="6" fill="#FFB3C0" opacity="0.6"/>
  <ellipse cx="290" cy="258" rx="10" ry="6" fill="#FFB3C0" opacity="0.6"/>
</svg>
