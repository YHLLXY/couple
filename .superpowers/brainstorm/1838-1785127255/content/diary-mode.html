<h2>共同日记 — 你倾向哪种模式？</h2>
<p class="subtitle">这决定了日记的数据结构和交互方式</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>共享一本日记</h3>
      <p>两个人写进同一本日记，所有条目混在一起展示。每条标记是谁写的（🐰小兔子 / 🐻小熊），双方看到的内容完全一样。</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>各自写各自的</h3>
      <p>每人有自己的日记本，独立管理。但可以互相翻阅对方的日记（只读）。写日记是私人的事，看日记是甜蜜的事。</p>
    </div>
  </div>
  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>共享 + 私密标记</h3>
      <p>默认所有人可见，但写日记时可以标记某条为「🔒 私密」，仅自己可见。兼顾共享的亲密感和私密空间的需求。</p>
    </div>
  </div>
</div>
