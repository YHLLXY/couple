<h2>日记入口在哪里？</h2>
<p class="subtitle">影响用户打开日记的频率和便利性</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>「我的」页面菜单入口</h3>
      <p>在 UserHome 菜单列表里加一项「📔 共同日记」，点击跳转到日记主页。类似积分中心的入口方式。不会占用底部导航栏位置。</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>底部 TabBar 独立入口</h3>
      <p>新增第五个底部 Tab「日记」，和互动/心愿/日历/我的平级。更高频、更显眼，但 TabBar 会挤一些。</p>
    </div>
  </div>
  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>日历 + 「我的」双入口</h3>
      <p>从日历点击有日记的日期 → 跳转到对应日期的日记；从「我的」菜单 → 进入日记主页浏览全部。不占 TabBar 但也不难找到。</p>
    </div>
  </div>
</div>
