<h2>日记编辑器 — 你希望多丰富？</h2>
<p class="subtitle">这决定了编辑器复杂度，也影响移动端的体验</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>简单文本框</h3>
      <p>纯文字，没有图片、没有排版。就像发一条长微博。最轻量，写起来没压力，移动端体验最好。</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>文字 + Emoji + 图片</h3>
      <p>支持插入表情和照片（最多 3 张），文字本身不做排版。类似小红书/朋友圈的编辑器体验。</p>
    </div>
  </div>
  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>完整富文本</h3>
      <p>支持加粗、标题、引用、图片嵌入等。更像正经的日记应用。但移动端编辑体验会打折扣。</p>
    </div>
  </div>
</div>
