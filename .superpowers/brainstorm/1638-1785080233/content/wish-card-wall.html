<h2>心愿卡片墙布局</h2>
<p class="subtitle">所有心愿以卡片瀑布流展示，用颜色/徽章区分状态和归属</p>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:600px;margin:0 auto;padding:16px;">

  <!-- Card 1: Pending from partner -->
  <div style="background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 12px rgba(255,122,149,0.12);border:2px solid #FF7A95;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <span style="background:#FFEEF3;color:#FF7A95;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:600;">🍽️ 吃的</span>
      <span style="background:#FF7A95;color:#fff;padding:2px 8px;border-radius:99px;font-size:10px;">待响应</span>
    </div>
    <p style="font-size:14px;color:#4A3A3A;margin:8px 0;line-height:1.5;">想吃你做的番茄炒蛋 🍳</p>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;">
      <div style="display:flex;align-items:center;gap:6px;">
        <span style="font-size:24px;">🐰</span>
        <span style="font-size:11px;color:#A89A9A;">TA · 10分钟前</span>
      </div>
      <span style="font-size:12px;color:#FF7A95;">⚡ 小急</span>
    </div>
  </div>

  <!-- Card 2: Accepted -->
  <div style="background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 12px rgba(255,122,149,0.12);border:2px solid #7AE0C4;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <span style="background:#E8FFF5;color:#5CBF9A;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:600;">💕 浪漫</span>
      <span style="background:#7AE0C4;color:#fff;padding:2px 8px;border-radius:99px;font-size:10px;">已接单</span>
    </div>
    <p style="font-size:14px;color:#4A3A3A;margin:8px 0;line-height:1.5;">今晚一起看电影吧 🎬</p>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;">
      <div style="display:flex;align-items:center;gap:6px;">
        <span style="font-size:24px;">👤</span>
        <span style="font-size:11px;color:#A89A9A;">我 · 1小时前</span>
      </div>
      <button style="background:#7AE0C4;color:#fff;border:none;padding:4px 12px;border-radius:99px;font-size:11px;cursor:pointer;">完成 ✓</button>
    </div>
  </div>

  <!-- Card 3: Done -->
  <div style="background:linear-gradient(135deg,#FFF8F2,#FFEEF3);border-radius:16px;padding:16px;box-shadow:0 2px 12px rgba(255,122,149,0.08);border:2px solid #F0E6E6;opacity:0.85;position:relative;">
    <div style="position:absolute;top:-8px;right:-8px;font-size:36px;transform:rotate(15deg);">✅</div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <span style="background:#F0E6E6;color:#A89A9A;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:600;">🏠 家务</span>
      <span style="background:#C4B8B8;color:#fff;padding:2px 8px;border-radius:99px;font-size:10px;">已完成</span>
    </div>
    <p style="font-size:14px;color:#A89A9A;margin:8px 0;line-height:1.5;text-decoration:line-through;">帮我把衣服叠好 👔</p>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;">
      <div style="display:flex;align-items:center;gap:6px;">
        <span style="font-size:24px;">🐰</span>
        <span style="font-size:11px;color:#C4B8B8;">TA · 昨天</span>
      </div>
      <span style="font-size:12px;color:#7AE0C4;">+5 甜蜜值</span>
    </div>
  </div>

  <!-- Card 4: Empty state trigger -->
  <div style="background:#fff;border-radius:16px;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px dashed #FFB17A;min-height:140px;cursor:pointer;">
    <span style="font-size:32px;margin-bottom:8px;">＋</span>
    <p style="font-size:13px;color:#FFB17A;font-weight:600;">发个心愿</p>
    <p style="font-size:10px;color:#C4B8B8;">告诉TA你想要什么</p>
  </div>

</div>

<div class="section" style="max-width:600px;margin:20px auto;">
  <h3>交互说明</h3>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
    <div style="background:#fff;border-radius:12px;padding:12px;">
      <strong style="font-size:13px;">点击卡片</strong>
      <p style="font-size:11px;color:#A89A9A;margin:4px 0 0;">弹出操作菜单：接单/留言/延期/小惊喜</p>
    </div>
    <div style="background:#fff;border-radius:12px;padding:12px;">
      <strong style="font-size:13px;">长按卡片</strong>
      <p style="font-size:11px;color:#A89A9A;margin:4px 0 0;">复制/删除/撤回（自己的心愿）</p>
    </div>
    <div style="background:#fff;border-radius:12px;padding:12px;">
      <strong style="font-size:13px;">下拉刷新</strong>
      <p style="font-size:11px;color:#A89A9A;margin:4px 0 0;">Vant PullRefresh 组件</p>
    </div>
    <div style="background:#fff;border-radius:12px;padding:12px;">
      <strong style="font-size:13px;">状态筛选</strong>
      <p style="font-size:11px;color:#A89A9A;margin:4px 0 0;">顶部标签：全部/待响应/进行中/已完成</p>
    </div>
  </div>
</div>

  * { box-sizing:border-box;margin:0;padding:0; }
